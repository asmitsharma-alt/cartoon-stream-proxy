<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon Stream - Netflix Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --hover-bg: #2a2a2a;
      --primary: #E50914;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #333;
      color: #fff;
      font-weight: 600;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      width: 100%;
      flex: 1;
    }
    /* Player Section */
    .player-section {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid var(--border);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .player-controls-bar {
      padding: 1rem 1.5rem;
      background: #111;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-top: 1px solid var(--border);
    }
    .now-playing {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .now-playing h2 {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .now-playing p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .control-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #3a3a3a;
      border-color: #555;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: #b80710;
    }
    select {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    /* Tabs & Filters */
    .tabs {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      overflow-x: auto;
    }
    .tab {
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      width: 300px;
      max-width: 100%;
    }
    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .ep-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .ep-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      background: var(--hover-bg);
    }
    .ep-card.playing {
      border-color: var(--primary);
      background: rgba(229, 9, 20, 0.1);
    }
    .ep-badge {
      font-size: 0.75rem;
      background: #333;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      display: inline-block;
      color: #aaa;
    }
    .ep-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      color: #fff;
      word-break: break-word;
    }
    .ep-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    /* Custom Scrubber / Timeline */
    .timeline-wrapper {
      padding: 0.75rem 1.5rem 0.25rem 1.5rem;
      background: #111;
      border-top: 1px solid var(--border);
    }
    .timeline-track-container {
      position: relative;
      width: 100%;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .timeline-track {
      position: relative;
      width: 100%;
      height: 5px;
      background: #333333;
      border-radius: 4px;
      transition: height 0.15s ease;
    }
    .timeline-track-container:hover .timeline-track {
      height: 8px;
    }
    .timeline-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 4px;
    }
    .timeline-thumb {
      position: absolute;
      top: 50%;
      right: -6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(229, 9, 20, 0.9);
      transform: translateY(-50%) scale(0);
      transition: transform 0.15s ease;
      pointer-events: none;
    }
    .timeline-track-container:hover .timeline-thumb {
      transform: translateY(-50%) scale(1);
    }
    .timeline-hover-time {
      position: absolute;
      top: -28px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.95);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid #444;
      pointer-events: none;
      display: none;
      white-space: nowrap;
      z-index: 10;
    }
    .jump-control-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #1f1f1f;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .jump-input {
      background: transparent;
      border: none;
      color: #fff;
      width: 75px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      text-align: center;
      font-family: inherit;
    }
    .jump-input::placeholder {
      color: #666;
      font-weight: normal;
    }
    .time-pill {
      font-family: monospace;
      font-size: 0.85rem;
      background: #222;
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
      border: 1px solid #333;
      color: #eee;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">
      <span>🍿 CARTOON STREAM</span>
      <span class="badge">NETFLIX EDITION</span>
    </a>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="/docs" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.8rem; background: #222; text-decoration: none;">📖 API & AI Docs</a>
      <a href="/llms.txt" target="_blank" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.8rem; background: #222; text-decoration: none;">🤖 llms.txt</a>
      <div id="status-pill" class="badge" style="background: #1b5e20;">⚡ ONLINE</div>
    </div>
  </header>

  <main class="container">

    <!-- VIDEO PLAYER COMPONENT -->
    <section class="player-section" id="player-container">
      <div class="video-wrapper">
        <video id="video-element" controls preload="metadata" playsinline></video>
      </div>

      <!-- INTERACTIVE TIMELINE SCRUBBER -->
      <div class="timeline-wrapper">
        <div class="timeline-track-container" id="timeline-container">
          <div class="timeline-track" id="timeline-track">
            <div class="timeline-fill" id="timeline-fill">
              <div class="timeline-thumb" id="timeline-thumb"></div>
            </div>
          </div>
          <div class="timeline-hover-time" id="timeline-hover-time">00:00</div>
        </div>
      </div>

      <!-- CONTROLS BAR -->
      <div class="player-controls-bar">
        <div class="now-playing">
          <h2 id="player-title">Select an Episode to Play</h2>
          <p id="player-subtitle">Zoho Catalyst Stratus • Instant Range Seeking • Multi-Audio Ready</p>
        </div>
        <div class="control-actions">
          <!-- Time Display -->
          <div class="time-pill" id="time-display">00:00 / 00:00</div>

          <!-- Language Selector -->
          <label style="font-size: 0.8rem; color: #aaa; font-weight: 600;">Audio:</label>
          <select id="audio-select">
            <option value="0">Detecting audio...</option>
          </select>

          <!-- Quick Navigation Actions -->
          <button class="btn" id="btn-back-30" title="Rewind 30 seconds">⏪ -30s</button>
          <button class="btn" id="btn-back-10" title="Rewind 10 seconds">⏪ -10s</button>
          <button class="btn" id="btn-fwd-10" title="Forward 10 seconds">+10s ⏩</button>
          <button class="btn" id="btn-fwd-30" title="Forward 30 seconds">+30s ⏩</button>
          <button class="btn" id="btn-skip-intro" title="Skip Intro (+90s)">⏭️ Skip Intro</button>

          <!-- Specific Timestamp Jump -->
          <div class="jump-control-group" title="Type timestamp (e.g. 05:20, 12:00, or 90) and click Jump">
            <span style="font-size: 0.8rem; color: #aaa;">⏱️</span>
            <input type="text" id="jump-time-input" class="jump-input" placeholder="MM:SS">
            <button class="btn btn-primary" id="btn-jump" style="padding: 0.35rem 0.65rem; font-size: 0.8rem;">Jump</button>
          </div>

          <button class="btn btn-primary" id="btn-next-ep">Next ⏭️</button>
        </div>
      </div>
    </section>

    <!-- SHOW SELECTOR TABS -->
    <div class="tabs" id="show-tabs"></div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <label style="font-size: 0.9rem; color: #aaa;">Season:</label>
        <select id="season-select"></select>
      </div>
      <input type="text" class="search-box" id="search-input" placeholder="🔍 Search episode by title or number...">
    </div>

    <!-- EPISODES GRID -->
    <div class="grid" id="episodes-grid"></div>

  </main>

  <script>
    let currentCatalog = null;
    let activeShow = null;
    let activeSeason = null;
    let activeEpisode = null;
    let currentEpisodesList = [];
    let currentAudioIndex = 0;
    let currentStreamOffset = 0;
    let totalDuration = 0;
    let isDraggingTimeline = false;

    const video = document.getElementById('video-element');
    const playerTitle = document.getElementById('player-title');
    const playerSubtitle = document.getElementById('player-subtitle');
    const showTabsContainer = document.getElementById('show-tabs');
    const seasonSelect = document.getElementById('season-select');
    const searchInput = document.getElementById('search-input');
    const episodesGrid = document.getElementById('episodes-grid');
    const audioSelect = document.getElementById('audio-select');
    const timeDisplay = document.getElementById('time-display');
    const timelineContainer = document.getElementById('timeline-container');
    const timelineTrack = document.getElementById('timeline-track');
    const timelineFill = document.getElementById('timeline-fill');
    const timelineHoverTime = document.getElementById('timeline-hover-time');

    const btnBack30 = document.getElementById('btn-back-30');
    const btnBack10 = document.getElementById('btn-back-10');
    const btnFwd10 = document.getElementById('btn-fwd-10');
    const btnFwd30 = document.getElementById('btn-fwd-30');
    const btnSkipIntro = document.getElementById('btn-skip-intro');
    const btnNextEp = document.getElementById('btn-next-ep');
    const jumpTimeInput = document.getElementById('jump-time-input');
    const btnJump = document.getElementById('btn-jump');

    // 0. Time Format & Parsing Helpers
    function formatTime(totalSeconds) {
      if (isNaN(totalSeconds) || totalSeconds < 0) return '00:00';
      const sec = Math.floor(totalSeconds % 60);
      const min = Math.floor((totalSeconds / 60) % 60);
      const hr = Math.floor(totalSeconds / 3600);

      const pad = (n) => String(n).padStart(2, '0');
      if (hr > 0) {
        return `${hr}:${pad(min)}:${pad(sec)}`;
      }
      return `${pad(min)}:${pad(sec)}`;
    }

    function parseTime(inputStr) {
      if (!inputStr) return null;
      const clean = inputStr.trim().toLowerCase().replace('s', '');
      if (!clean) return null;

      // Handle MM:SS or HH:MM:SS
      if (clean.includes(':')) {
        const parts = clean.split(':').map(Number);
        if (parts.some(isNaN)) return null;
        if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        } else if (parts.length === 3) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
      }

      // Handle pure numeric seconds
      const num = parseFloat(clean);
      return isNaN(num) ? null : num;
    }

    function getEffectiveCurrentTime() {
      if (!video) return 0;
      return currentStreamOffset + (video.currentTime || 0);
    }

    // Update Scrubber & Time Display on Playback
    function updateProgressUI() {
      const cur = getEffectiveCurrentTime();
      const dur = totalDuration || (video.duration ? video.duration + currentStreamOffset : 0);

      timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;

      if (dur > 0) {
        const pct = Math.min(100, Math.max(0, (cur / dur) * 100));
        timelineFill.style.width = `${pct}%`;
      }
    }

    video.ontimeupdate = () => {
      if (!isDraggingTimeline) {
        updateProgressUI();
      }
    };

    video.onloadedmetadata = () => {
      if (video.duration && !isNaN(video.duration) && video.duration !== Infinity) {
        if (!totalDuration || currentStreamOffset === 0) {
          totalDuration = Math.round(video.duration);
        }
      }
      updateProgressUI();
    };

    // 1. Fetch Full Catalog from AppSail API
    async function loadCatalog() {
      try {
        const res = await fetch('/api/catalog');
        const data = await res.json();
        currentCatalog = data;

        // Render Tabs
        showTabsContainer.innerHTML = '';
        data.shows.forEach((show, idx) => {
          const tab = document.createElement('div');
          tab.className = `tab ${idx === 0 ? 'active' : ''}`;
          tab.textContent = show.title;
          tab.onclick = () => selectShow(show.id);
          showTabsContainer.appendChild(tab);
        });

        // Default to first show
        if (data.shows.length > 0) {
          selectShow(data.shows[0].id);
        }
      } catch (err) {
        console.error('Failed to load catalog:', err);
      }
    }

    // 2. Select Show and Load Seasons
    async function selectShow(showId) {
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.textContent.includes(showId) || (currentCatalog.shows.find(s => s.id === showId && t.textContent === s.title)));
      });

      const res = await fetch(`/api/show/${showId}`);
      activeShow = await res.json();

      // Populate Season Dropdown
      const seasonKeys = Object.keys(activeShow.seasons);
      seasonSelect.innerHTML = '';
      seasonKeys.forEach(sName => {
        const opt = document.createElement('option');
        opt.value = sName;
        opt.textContent = `${sName} (${activeShow.seasons[sName].length} items)`;
        seasonSelect.appendChild(opt);
      });

      if (seasonKeys.length > 0) {
        selectSeason(seasonKeys[0]);
      }
    }

    // 3. Select Season & Render Episodes
    function selectSeason(seasonName) {
      activeSeason = seasonName;
      currentEpisodesList = activeShow.seasons[seasonName] || [];
      renderEpisodes(currentEpisodesList);
    }

    // 4. Render Grid
    function renderEpisodes(episodes) {
      episodesGrid.innerHTML = '';
      if (episodes.length === 0) {
        episodesGrid.innerHTML = '<div style="color: #888; grid-column: 1/-1;">No episodes found.</div>';
        return;
      }

      episodes.forEach(ep => {
        const card = document.createElement('div');
        card.className = `ep-card ${activeEpisode && activeEpisode.id === ep.id ? 'playing' : ''}`;
        card.onclick = () => playEpisode(ep);

        card.innerHTML = `
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <span class="ep-badge">EP ${ep.episode_number || ep.movie_number || '•'}</span>
              <span style="font-size: 0.75rem; color: #4caf50;">⚡ Stream Ready</span>
            </div>
            <div class="ep-title">${ep.title || ep.filename}</div>
          </div>
          <div class="ep-meta">
            <span>💾 ${ep.size_mb ? ep.size_mb + ' MB' : 'Full HD'}</span>
            <span style="color: var(--primary); font-weight: 600;">▶ Play</span>
          </div>
        `;
        episodesGrid.appendChild(card);
      });
    }

    // 5. Fetch & Populate Real Audio Tracks & Exact Duration
    async function updateAudioTracksAndDuration(ep) {
      audioSelect.innerHTML = '<option value="0">Detecting audio...</option>';
      audioSelect.disabled = true;

      try {
        const res = await fetch(`/api/tracks?key=${encodeURIComponent(ep.key)}`);
        const data = await res.json();
        audioSelect.innerHTML = '';

        if (data.duration && data.duration > 0) {
          totalDuration = data.duration;
          updateProgressUI();
        }

        if (data.audioTracks && data.audioTracks.length > 0) {
          data.audioTracks.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.index;
            opt.textContent = t.label;
            audioSelect.appendChild(opt);
          });
          audioSelect.value = String(currentAudioIndex);
          audioSelect.disabled = data.audioTracks.length <= 1;

          if (data.audioTracks.length > 1) {
            playerSubtitle.textContent = `Streaming from Zoho Stratus • ⚡ ${data.audioTracks.length} Audio Tracks Available`;
          }
        } else {
          audioSelect.innerHTML = '<option value="0">🔊 Default Audio</option>';
          audioSelect.disabled = true;
        }
      } catch (err) {
        console.warn('Track detection failed:', err);
        audioSelect.innerHTML = '<option value="0">🔊 Default Audio</option>';
        audioSelect.disabled = true;
      }
    }

    // 6. Play Episode Function
    function playEpisode(ep, targetTime = 0, audioIdx = 0) {
      activeEpisode = ep;
      currentAudioIndex = audioIdx;
      currentStreamOffset = targetTime;
      totalDuration = 0;

      playerTitle.textContent = `${activeShow.title} - ${ep.title}`;
      playerSubtitle.textContent = `Loading from Zoho Stratus • Key: ${ep.key}`;

      // Update real available audio tracks and exact duration
      updateAudioTracksAndDuration(ep);

      // Default stream URL
      let streamUrl = `/api/stream?key=${encodeURIComponent(ep.key)}`;
      if (currentAudioIndex > 0) {
        streamUrl += `&audio=${currentAudioIndex}`;
      }
      if (targetTime > 0) {
        streamUrl += `&t=${targetTime}`;
      }

      video.src = streamUrl;
      video.load();
      video.play().catch(() => {});

      // Scroll to player smoothly
      document.getElementById('player-container').scrollIntoView({ behavior: 'smooth' });

      // Update UI active card
      renderEpisodes(currentEpisodesList);
    }

    // 7. Universal Seek Function (Works on ALL formats and timestamps)
    function seekToTimestamp(targetSeconds) {
      if (!activeEpisode) return;

      const dur = totalDuration || (video.duration ? video.duration + currentStreamOffset : 999999);
      const clampedSec = Math.max(0, Math.min(Math.floor(targetSeconds), dur));
      const isPaused = video.paused;
      const isMkv = activeEpisode.key.toLowerCase().endsWith('.mkv');

      // If playing with audio override OR is MKV container: reload stream with -ss offset
      if (currentAudioIndex > 0 || isMkv) {
        currentStreamOffset = clampedSec;
        playerSubtitle.textContent = `⚡ Jumping to ${formatTime(clampedSec)}...`;

        const newSrc = `/api/stream?key=${encodeURIComponent(activeEpisode.key)}&audio=${currentAudioIndex}&t=${clampedSec}`;
        video.src = newSrc;
        video.load();

        video.onloadeddata = () => {
          if (!isPaused) video.play().catch(() => {});
          playerSubtitle.textContent = `Playing at ${formatTime(clampedSec)} • Active: ${activeEpisode.title}`;
          video.onloadeddata = null;
        };
      } else {
        // Standard MP4: instant native range seek
        currentStreamOffset = 0;
        video.currentTime = clampedSec;
        if (!isPaused) video.play().catch(() => {});
      }

      updateProgressUI();
    }

    // 8. Interactive Timeline Scrubber (Click & Drag)
    function getTimelineTimeFromEvent(e) {
      const rect = timelineTrack.getBoundingClientRect();
      const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const percent = clickX / rect.width;
      const dur = totalDuration || (video.duration ? video.duration + currentStreamOffset : 0);
      return { time: percent * dur, percent: percent * 100, clientX: e.clientX, rect: rect };
    }

    timelineContainer.addEventListener('mousemove', (e) => {
      const { time, clientX, rect } = getTimelineTimeFromEvent(e);
      timelineHoverTime.style.display = 'block';
      timelineHoverTime.style.left = `${clientX - rect.left}px`;
      timelineHoverTime.textContent = formatTime(time);
    });

    timelineContainer.addEventListener('mouseleave', () => {
      if (!isDraggingTimeline) {
        timelineHoverTime.style.display = 'none';
      }
    });

    timelineContainer.addEventListener('click', (e) => {
      const { time } = getTimelineTimeFromEvent(e);
      seekToTimestamp(time);
    });

    timelineContainer.addEventListener('mousedown', (e) => {
      isDraggingTimeline = true;
      const { time, percent } = getTimelineTimeFromEvent(e);
      timelineFill.style.width = `${percent}%`;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDraggingTimeline) {
        const { time, percent } = getTimelineTimeFromEvent(e);
        timelineFill.style.width = `${percent}%`;
        timeDisplay.textContent = `${formatTime(time)} / ${formatTime(totalDuration)}`;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isDraggingTimeline) {
        isDraggingTimeline = false;
        timelineHoverTime.style.display = 'none';
        const { time } = getTimelineTimeFromEvent(e);
        seekToTimestamp(time);
      }
    });

    // 9. Jump to Timestamp Input Event
    function handleJumpInput() {
      const val = jumpTimeInput.value;
      const parsed = parseTime(val);
      if (parsed === null) {
        alert('Please enter a valid time (e.g. 05:20, 12:00, or 90)');
        return;
      }
      seekToTimestamp(parsed);
      jumpTimeInput.value = '';
    }

    btnJump.onclick = handleJumpInput;
    jumpTimeInput.onkeydown = (e) => {
      if (e.key === 'Enter') {
        handleJumpInput();
      }
    };

    // 10. Quick Relative Skip Buttons
    btnBack30.onclick = () => seekToTimestamp(getEffectiveCurrentTime() - 30);
    btnBack10.onclick = () => seekToTimestamp(getEffectiveCurrentTime() - 10);
    btnFwd10.onclick = () => seekToTimestamp(getEffectiveCurrentTime() + 10);
    btnFwd30.onclick = () => seekToTimestamp(getEffectiveCurrentTime() + 30);
    btnSkipIntro.onclick = () => seekToTimestamp(getEffectiveCurrentTime() + 90);

    // 11. Interactive Audio Language Switcher
    audioSelect.onchange = (e) => {
      if (!activeEpisode) return;
      const newAudioIdx = parseInt(e.target.value, 10);
      currentAudioIndex = newAudioIdx;
      const curTime = Math.floor(getEffectiveCurrentTime());
      const selectedName = e.target.options[e.target.selectedIndex].text;

      seekToTimestamp(curTime);
      playerSubtitle.textContent = `Streaming with ${selectedName} • Active: ${activeEpisode.title}`;
    };

    // 12. Universal Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      // Ignore if typing in text inputs
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'j') {
        e.preventDefault();
        seekToTimestamp(getEffectiveCurrentTime() - 10);
      } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'l') {
        e.preventDefault();
        seekToTimestamp(getEffectiveCurrentTime() + 10);
      } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (video.paused) video.play().catch(() => {});
        else video.pause();
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (!document.fullscreenElement) video.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
      } else if (e.key.toLowerCase() === 'm') {
        e.preventDefault();
        video.muted = !video.muted;
      }
    });

    // 13. Search & Navigation
    seasonSelect.onchange = (e) => selectSeason(e.target.value);

    searchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = currentEpisodesList.filter(ep => 
        (ep.title && ep.title.toLowerCase().includes(q)) || 
        (ep.filename && ep.filename.toLowerCase().includes(q)) ||
        String(ep.episode_number).includes(q)
      );
      renderEpisodes(filtered);
    };

    btnNextEp.onclick = () => {
      if (!activeEpisode) return;
      const curIdx = currentEpisodesList.findIndex(e => e.id === activeEpisode.id);
      if (curIdx !== -1 && curIdx + 1 < currentEpisodesList.length) {
        playEpisode(currentEpisodesList[curIdx + 1]);
      } else {
        alert('You reached the last episode of this season!');
      }
    };

    video.onended = () => {
      btnNextEp.click();
    };

    // Init
    loadCatalog();
  </script>
</body>
</html>
