name: Cloud-to-Cloud Migration Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to migrate'
        required: true
        default: 'movies-turbo'
        type: choice
        options:
          - pokemon-turbo
          - pokemon
          - pokemon-batch-1
          - pokemon-batch-2
          - pokemon-batch-3
          - pokemon-batch-4
          - pokemon-batch-5
          - pokemon-batch-6
          - pokemon-batch-7
          - pokemon-batch-8
          - pokemon-batch-9
          - pokemon-batch-10
          - movies-turbo
          - movies-matrix
          - doraemon-turbo
          - oggy-missing
          - movie-04
          - matrix-all
          - sample-movie
          - all-movies
          - movies-batch-1
          - movies-batch-2
          - movies-batch-3
          - movies-batch-4
          - movies-batch-5
          - movies-batch-6
          - movies-batch-7
          - movies-batch-8
          - movies-batch-9
          - movies-batch-10
          - doraemon
          - shinchan
          - oggy
          - chhota-bheem
          - sample-episode

permissions:
  contents: write

jobs:
  migrate-movies-turbo:
    if: github.event.inputs.target == 'movies-turbo' || github.event.inputs.target == 'movies-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        batch:
          - movies-batch-1
          - movies-batch-2
          - movies-batch-3
          - movies-batch-4
          - movies-batch-5
          - movies-batch-6
          - movies-batch-7
          - movies-batch-8
          - movies-batch-9
          - movies-batch-10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm install --production --force

      - name: Run Cloud Migration
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZOHO_CREDENTIALS: ${{ secrets.ZOHO_CREDENTIALS }}
        run: |
          node migrate.js --target "${{ matrix.batch }}"

      - name: Commit & Push Updated Manifest
        continue-on-error: true
        run: |
          git config user.name "Cloud Migration Bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add zoho_manifest*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update zoho_manifest_${{ matrix.batch }} [skip ci]" && git push) || true

  migrate-pokemon-turbo:
    if: github.event.inputs.target == 'pokemon-turbo'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        batch:
          - pokemon-batch-1
          - pokemon-batch-2
          - pokemon-batch-3
          - pokemon-batch-4
          - pokemon-batch-5
          - pokemon-batch-6
          - pokemon-batch-7
          - pokemon-batch-8
          - pokemon-batch-9
          - pokemon-batch-10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm install --production --force

      - name: Run Cloud Migration
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZOHO_CREDENTIALS: ${{ secrets.ZOHO_CREDENTIALS }}
          CONCURRENCY: 8
          MANIFEST_FILE: zoho_manifest_${{ matrix.batch }}.json
        run: |
          node migrate.js --target "${{ matrix.batch }}"

      - name: Commit & Push Updated Manifest
        continue-on-error: true
        run: |
          git config user.name "Cloud Migration Bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add zoho_manifest*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update zoho_manifest_${{ matrix.batch }} [skip ci]" && git push) || true

  migrate-doraemon-turbo:
    if: github.event.inputs.target == 'doraemon-turbo'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        season:
          - doraemon-s11
          - doraemon-s12
          - doraemon-s14
          - doraemon-s15
          - doraemon-s16
          - doraemon-s17
          - doraemon-s18
          - doraemon-s19
          - doraemon-s20
          - doraemon-s21-22
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm install --production --force

      - name: Run Cloud Migration
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZOHO_CREDENTIALS: ${{ secrets.ZOHO_CREDENTIALS }}
          CONCURRENCY: 8
        run: |
          node migrate.js --target "${{ matrix.season }}"

      - name: Commit & Push Updated Manifest
        continue-on-error: true
        run: |
          git config user.name "Cloud Migration Bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add zoho_manifest*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update zoho_manifest_${{ matrix.season }} [skip ci]" && git push) || true

  migrate-parallel:
    if: github.event.inputs.target == 'matrix-all'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        show:
          - doraemon
          - shinchan
          - oggy
          - chhota-bheem
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm install --production --force

      - name: Run Cloud Migration
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZOHO_CREDENTIALS: ${{ secrets.ZOHO_CREDENTIALS }}
        run: |
          node migrate.js --target "${{ matrix.show }}"

      - name: Commit & Push Updated Manifest
        continue-on-error: true
        run: |
          git config user.name "Cloud Migration Bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add zoho_manifest*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update zoho_manifest_${{ matrix.show }} [skip ci]" && git push) || true

  migrate-single:
    if: github.event.inputs.target != 'matrix-all' && github.event.inputs.target != 'movies-turbo' && github.event.inputs.target != 'movies-matrix' && github.event.inputs.target != 'doraemon-turbo' && github.event.inputs.target != 'pokemon-turbo'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm install --production --force

      - name: Run Cloud Migration
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZOHO_CREDENTIALS: ${{ secrets.ZOHO_CREDENTIALS }}
          CONCURRENCY: 4
        run: |
          node migrate.js --target "${{ github.event.inputs.target }}"

      - name: Commit & Push Updated Manifest
        continue-on-error: true
        run: |
          git config user.name "Cloud Migration Bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add zoho_manifest*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update zoho_manifest [skip ci]" && git push) || true
