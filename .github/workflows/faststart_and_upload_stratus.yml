name: Turbo Faststart & Upload to Zoho Stratus (14 Movies Parallel)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select movie to process (or ALL for max parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - 'ALL'
          - '00 - 2112 The Birth of Doraemon (1995)'
          - '27 - Nobitas New Great Adventure into Underworld (2007)'
          - '28 - Nobita and the Green Giant Legend (2008)'
          - '29 - Nobitas Spaceblazer (2009)'
          - '30 - The Great Battle of the Mermaid King (2010)'
          - '31 - Nobita and the New Steel Troops (2011)'
          - '32 - Nobita and the Island of Miracles (2012)'
          - '33 - Nobitas Secret Gadget Museum (2013)'
          - '34 - New Nobitas Great Demon Peko and Five (2014)'
          - '35 - Nobitas Space Heroes (2015)'
          - '37 - Nobitas Great Adventure in Antarctica (2017)'
          - '38 - Nobitas Treasure Island (2018)'
          - '39 - Nobitas Chronicle of the Moon Exploration (2019)'
          - '40 - Nobitas New Dinosaur (2020)'

permissions:
  contents: read

jobs:
  faststart-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        movie:
          - num: "00"
            title: "2112: The Birth of Doraemon (1995)"
            key: "Doraemon/Movies/2112_-_The_Birth_of_Doraemon__1995_.mp4"
            url: "https://archive.org/download/doraemon-1995-2112-nen-doraemon-tanjou-2112-the-birth-of-doraemon-amzn-web-dl/Doraemon%20%281995%29%20-%202112%20The%20Birth%20of%20Doraemon%20%5BAMZN%20WEB-DL%201080p%20AVC%20MP3%20HIN%5D%20-%20ZR0.mp4"
          - num: "27"
            title: "Nobita's New Great Adventure into Underworld (2007)"
