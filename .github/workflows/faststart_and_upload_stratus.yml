            key: "Doraemon/Movies/Doraemon_-_Nobita_s_Great_Adventure_in_the_Antarctic_Kachi_Kochi__2017_.mp4"
            url: "https://archive.org/download/doraemon-movie-01-40-1980-2020-1080p-amzn-web-dl-japanese-ddp-hindi-zr0/37.%20Doraemon%20-%20Nobita%27s%20Great%20Adventure%20in%20Antarctica%20Kachi%20Kochi%20%282017%29%201080p%20AMZN%20WEB-DL%20%5BJapanese%20DDP%205.1%20%2B%20Hindi%202.0%5D%20-%20ZR0.mp4"
          - num: "38"
            title: "Nobita's Treasure Island (2018)"
            key: "Doraemon/Movies/Doraemon_-_Nobita_s_Treasure_Island__2018_.mp4"
            url: "https://archive.org/download/doraemon-movie-01-40-1980-2020-1080p-amzn-web-dl-japanese-ddp-hindi-zr0/38.%20Doraemon%20-%20Nobita%27s%20Treasure%20Island%20%282018%29%201080p%20AMZN%20WEB-DL%20%5BJapanese%20DDP%205.1%20%2B%20Hindi%202.0%5D%20-%20ZR0.mp4"
          - num: "39"
            title: "Nobita's Chronicle of the Moon Exploration (2019)"
            key: "Doraemon/Movies/Doraemon_-_Nobita_s_Chronicle_of_the_Moon_Exploration__2019_.mp4"
            url: "https://archive.org/download/doraemon-movie-01-40-1980-2020-1080p-amzn-web-dl-japanese-ddp-hindi-zr0/39.%20Doraemon%20-%20Nobita%27s%20Chronicle%20of%20the%20Moon%20Exploration%20%282019%29%201080p%20AMZN%20WEB-DL%20%5BJapanese%20DDP%205.1%20%2B%20Hindi%202.0%5D%20-%20ZR0.mp4"
          - num: "40"
            title: "Nobita's New Dinosaur (2020)"
            key: "Doraemon/Movies/Doraemon_-_Nobita_s_New_Dinosaur__2020_.mp4"
            url: "https://archive.org/download/doraemon-movie-01-40-1980-2020-1080p-amzn-web-dl-japanese-ddp-hindi-zr0/40.%20Doraemon%20-%20Nobita%27s%20New%20Dinosaur%20%282020%29%201080p%20AMZN%20WEB-DL%20%5BJapanese%20DDP%205.1%20%2B%20Hindi%202.0%5D%20-%20ZR0.mp4"

    steps:
      - name: Check Selection Filter
        id: filter
        run: |
          SELECTED="${{ github.event.inputs.target }}"
          MOVIE_NUM="${{ matrix.movie.num }}"
          if [ "$SELECTED" != "ALL" ] && [[ "$SELECTED" != "$MOVIE_NUM"* ]]; then
            echo "Skipping movie #$MOVIE_NUM (User selected: $SELECTED)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Processing movie #$MOVIE_NUM: ${{ matrix.movie.title }}"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Maximize Runner NVMe SSD Disk Space
        if: steps.filter.outputs.skip != 'true'
        run: |
          echo "=== Freeing up disk space on runner ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install High-Performance Acceleration Tools
        if: steps.filter.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 ffmpeg curl jq

      - name: Turbo Download from Archive.org (16x Multi-Chunk Stream)
        if: steps.filter.outputs.skip != 'true'
        run: |
          echo "=== Starting 16x Turbo Download for: ${{ matrix.movie.title }} ==="
          aria2c -x 16 -s 16 -j 16 -k 2M \
            --file-allocation=none \
            --check-certificate=false \
            --user-agent="Mozilla/5.0" \
            --summary-interval=5 \
            -o raw_input.mp4 \
            "${{ matrix.movie.url }}"
          ls -lh raw_input.mp4

      - name: Faststart MOOV Atom Optimization (ffmpeg -c copy)
        if: steps.filter.outputs.skip != 'true'
        run: |
          echo "=== Relocating MOOV atom to beginning of file ==="
          ffmpeg -i raw_input.mp4 -c copy -movflags +faststart -threads 0 faststart_output.mp4
          rm -f raw_input.mp4
          ls -lh faststart_output.mp4

      - name: Verify Faststart Atom Layout
        if: steps.filter.outputs.skip != 'true'
        run: |
          python3 -c "
          with open('faststart_output.mp4', 'rb') as f:
              f.seek(0)
              ftyp_size = int.from_bytes(f.read(4), 'big')
              ftyp_name = f.read(4).decode('latin1')
              print(f'[Atom 1] {ftyp_name}: {ftyp_size} bytes at offset 0')
              f.seek(ftyp_size)
              next_size = int.from_bytes(f.read(4), 'big')
              next_name = f.read(4).decode('latin1')
              print(f'[Atom 2] {next_name}: {next_size} bytes at offset {ftyp_size}')
              if next_name == 'moov':
                  print('>>> VERIFIED: moov atom is located at HEAD (Faststart confirmed)!')
              else:
                  print(f'>>> Warning: second atom is {next_name}, checking further...')
          "

      - name: Request Direct Stratus Upload Signature from AppSail
        if: steps.filter.outputs.skip != 'true'
        id: get_sig
        run: |
          KEY="${{ matrix.movie.key }}"
          ADMIN_SECRET="${{ secrets.ADMIN_SECRET }}"
          if [ -z "$ADMIN_SECRET" ]; then
            ADMIN_SECRET="scoopplus-admin-secret-2026"
          fi
          echo "Requesting upload URL for $KEY..."
          RESP=$(curl -s -H "x-admin-secret: $ADMIN_SECRET" "https://cartoon-server-50046883835.development.catalystappsail.in/api/diag/stratus-upload-url?key=$KEY")
          UPLOAD_URL=$(echo "$RESP" | jq -r .uploadUrl)
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "Failed to retrieve upload URL: $RESP"
            exit 1
          fi
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "Successfully acquired Zoho Stratus STS signature."

      - name: Upload Faststart Master to Zoho Stratus (Direct HTTP PUT)
        if: steps.filter.outputs.skip != 'true'
        run: |
          UPLOAD_URL="${{ steps.get_sig.outputs.upload_url }}"
          echo "=== Uploading faststart_output.mp4 to Zoho Stratus ==="
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT --upload-file faststart_output.mp4 "$UPLOAD_URL")
          echo "Stratus Upload Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Upload failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          rm -f faststart_output.mp4
          echo "=== Movie ${{ matrix.movie.num }} successfully uploaded to Zoho Stratus! ==="

      - name: Verify Live Playback & Head on Zoho Stratus
        if: steps.filter.outputs.skip != 'true'
        run: |
          echo "=== Verifying uploaded file on live Stratus bucket ==="
          curl -s -I "https://stream-development.zohostratus.in/${{ matrix.movie.key }}" | grep -E "HTTP/|content-length|etag"
